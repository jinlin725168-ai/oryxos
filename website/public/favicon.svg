<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- OryxOS favicon：阿拉伯羚羊的一对长直角 + 脸，深底琥珀橙 -->
  <rect width="32" height="32" rx="7" fill="#0f172a"/>
  <g fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 长角（长、近直、略外张） -->
    <path d="M13.4 17.5 C 12 12, 11 8, 10.6 3.8"/>
    <path d="M18.6 17.5 C 20 12, 21 8, 21.4 3.8"/>
    <!-- 脸 / 口鼻 -->
    <path d="M13.4 17.8 C 12.9 23, 16 27, 16 27 C 16 27, 19.1 23, 18.6 17.8"/>
  </g>
  <!-- 眼睛 + 鼻 -->
  <circle cx="14.1" cy="20.4" r="0.85" fill="#fb923c"/>
  <circle cx="17.9" cy="20.4" r="0.85" fill="#fb923c"/>
  <circle cx="16" cy="24.2" r="0.9" fill="#fb923c"/>
</svg>
